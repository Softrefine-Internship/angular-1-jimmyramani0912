<div class="container">
  <div class="cards-container">
    <div
      class="profile-card"
      *ngFor="let userDetail of userDetails; let i = index"
      [ngStyle]="{ 'background-color': bgColors[i % bgColors.length] }"
    >
      <div class="card-heading">
        <h3 class="card-title">{{ userDetail.name }}</h3>
      </div>

      <div class="card-body" *ngIf="!userDetail.edit; else edit">
        <p><strong>Email:</strong> {{ userDetail.email }}</p>
        <p><strong>Phone:</strong> {{ userDetail.phoneNo }}</p>
        <p><strong>Age:</strong> {{ userDetail.age }}</p>

        <button class="btn w-100" (click)="userDetail.edit = true">Edit</button>
      </div>

      <ng-template #edit>
        <div class="card-body">
          <form>
            <div class="form-group mb-2">
              <label>Name:</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="userDetail.name"
                name="name"
                required
              />
            </div>

            <div class="form-group mb-2">
              <label>Email:</label>
              <input
                type="email"
                class="form-control"
                [(ngModel)]="userDetail.email"
                name="email"
                required
              />
            </div>

            <div class="form-group mb-2">
              <label>Phone No:</label>
              <input
                type="tel"
                class="form-control"
                [(ngModel)]="userDetail.phoneNo"
                name="phone"
                required
              />
            </div>

            <div class="form-group mb-3">
              <label>Age:</label>
              <input
                type="number"
                class="form-control"
                [(ngModel)]="userDetail.age"
                name="age"
                required
              />
            </div>

            <button
              class="btn w-100"
              type="submit"
              (click)="userDetail.edit = false"
            >
              Update
            </button>
          </form>
        </div>
      </ng-template>
    </div>
  </div>
</div>
